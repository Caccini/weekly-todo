<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A private weekly planner with persistent checkboxes and simple add and delete controls.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Weekly To-Do">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/Caccini/weekly-todo/main/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/Caccini/weekly-todo/main/apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://raw.githubusercontent.com/Caccini/weekly-todo/main/apple-touch-icon.png">
  <title>Weekly To-Do</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --muted: #626262;
      --line: #d8d8d8;
      --soft: #f6f6f6;
      --paper: #ffffff;
      --danger: #8b1e1e;
      --shadow: 0 18px 50px rgba(0, 0, 0, .16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    button {
      color: inherit;
      background: transparent;
      border: 1px solid var(--ink);
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
    }

    button:focus-visible, input:focus-visible {
      outline: 3px solid #111111;
      outline-offset: 2px;
    }

    .shell {
      width: min(860px, calc(100% - 32px));
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 0 max(40px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 18px;
      border-bottom: 2px solid var(--ink);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .week-range {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .canvas-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      font-weight: 650;
      text-decoration: none;
      white-space: nowrap;
    }

    .canvas-button:hover,
    .canvas-button:focus-visible {
      background: var(--ink);
      color: var(--paper);
    }

    .canvas-button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
    }

    .note {
      margin: 16px 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .week-calendar {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin: 18px 0 0;
    }

    .calendar-day {
      display: grid;
      width: 100%;
      justify-items: center;
      gap: 2px;
      padding: 10px 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
    }

    .calendar-day:hover,
    .calendar-day:focus-visible {
      border-color: var(--ink);
    }

    .calendar-day.is-active {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
    }

    .calendar-day.is-active .calendar-weekday,
    .calendar-day.is-active .calendar-month {
      color: var(--paper);
    }

    .calendar-weekday,
    .calendar-month {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .calendar-number {
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    .days {
      display: grid;
      gap: 28px;
    }

    .day {
      break-inside: avoid;
    }

    .day-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 9px;
    }

    .day h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .day-date {
      color: var(--muted);
      font-size: 14px;
    }

    .task-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line);
    }

    .task {
      display: grid;
      grid-template-columns: 24px 110px minmax(0, 1fr) 40px;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      border-bottom: 1px solid var(--line);
    }

    .task:last-child {
      border-bottom: 0;
    }

    .task input[type="checkbox"] {
      appearance: none;
      width: 20px;
      height: 20px;
      margin: 0;
      border: 1.5px solid var(--ink);
      border-radius: 2px;
      background: var(--paper);
      display: grid;
      place-content: center;
      cursor: pointer;
    }

    .task input[type="checkbox"]::before {
      content: "";
      width: 10px;
      height: 6px;
      border-left: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      transform: rotate(-45deg) scale(0);
      transform-origin: center;
      transition: transform 90ms ease;
    }

    .task input[type="checkbox"]:checked::before {
      transform: rotate(-45deg) scale(1);
    }

    .task-time {
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .task-text {
      min-width: 0;
      font-size: 17px;
      line-height: 1.3;
      overflow-wrap: anywhere;
      cursor: text;
    }

    .task-text-edit {
      width: 100%;
      margin: -5px 0;
      padding: 5px 7px;
      border: 1px solid var(--ink);
      border-radius: 4px;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      line-height: 1.3;
    }

    .task.done .task-time,
    .task.done .task-text {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }

    .task-menu-wrap {
      position: relative;
      display: grid;
      place-items: center;
    }

    .task-menu-trigger {
      width: 36px;
      height: 36px;
      padding: 0;
      border-color: transparent;
      color: var(--muted);
      font-size: 21px;
      line-height: 1;
    }

    .task-menu-trigger:hover,
    .task-menu-trigger[aria-expanded="true"] {
      background: var(--soft);
      color: var(--ink);
    }

    .task-menu {
      position: absolute;
      z-index: 10;
      top: calc(100% + 4px);
      right: 0;
      display: grid;
      min-width: 150px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .14);
    }

    .task-menu[hidden] { display: none; }

    .task-menu button {
      min-height: 38px;
      padding: 0 10px;
      border: 0;
      border-radius: 7px;
      text-align: left;
    }

    .task-menu button:hover,
    .task-menu button:focus-visible { background: var(--soft); }
    .task-menu .danger-action { color: var(--danger); }

    .add-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
    }

    .add-task {
      padding: 8px 12px;
      border-color: var(--line);
    }

    .add-task:hover { background: var(--soft); border-color: var(--ink); }

    .empty {
      padding: 15px 0;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }

    dialog {
      width: min(440px, calc(100% - 32px));
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    dialog::backdrop { background: rgba(0,0,0,.34); }

    .dialog-form { padding: 22px; }

    .dialog-heading {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .dialog-form h3 {
      margin: 0;
      font-size: 22px;
    }

    .dialog-description {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .dialog-close {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      color: var(--muted);
      font-size: 22px;
    }

    .dialog-close:hover { background: var(--soft); color: var(--ink); }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .field input {
      width: 100%;
      min-height: 44px;
      padding: 9px 11px;
      border: 1px solid var(--ink);
      border-radius: 7px;
      background: var(--paper);
      color: var(--ink);
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .dialog-actions button { padding: 9px 14px; }
    .cancel-button { border-color: var(--line); }
    .save-button { background: var(--ink); color: var(--paper); }
    .danger-button { background: var(--danger); border-color: var(--danger); color: var(--paper); }

    .toast {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      max-width: calc(100% - 32px);
      padding: 10px 14px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      box-shadow: 0 8px 28px rgba(0,0,0,.18);
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    [data-tooltip] { position: relative; }

    @media (hover: hover) {
      [data-tooltip]::after {
        content: attr(data-tooltip);
        position: absolute;
        z-index: 20;
        left: 50%;
        bottom: calc(100% + 8px);
        width: max-content;
        max-width: 180px;
        padding: 6px 8px;
        border-radius: 6px;
        background: var(--ink);
        color: var(--paper);
        font-size: 12px;
        line-height: 1.2;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 3px);
        transition: opacity 120ms ease, transform 120ms ease;
      }

      [data-tooltip]:hover::after,
      [data-tooltip]:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 620px) {
      .shell { width: min(100% - 24px, 860px); }
      header { align-items: start; }
      .week-calendar {
        grid-auto-flow: column;
        grid-auto-columns: 74px;
        grid-template-columns: none;
        overflow-x: auto;
        padding-bottom: 3px;
      }
      .task {
        grid-template-columns: 22px 1fr 32px;
        gap: 10px;
        padding: 8px 0;
      }
      .task-time {
        grid-column: 2;
        font-size: 13px;
      }
      .task-text {
        grid-column: 2;
        font-size: 17px;
        margin-top: -5px;
      }
      .task input[type="checkbox"] { grid-row: 1 / 3; }
      .task-menu-wrap { grid-column: 3; grid-row: 1 / 3; }
    }

    @media print {
      .shell { width: 100%; padding: 0; }
      .canvas-button, .note, .week-calendar, .add-row, .task-menu-wrap { display: none !important; }
      header { margin-bottom: 18px; }
      .days { gap: 18px; }
      .task { min-height: 36px; }
      .task-text { font-size: 14px; }
      .task.done .task-time, .task.done .task-text { color: var(--ink); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Weekly To-Do</h1>
        <p class="week-range" id="weekRange"></p>
      </div>
      <a class="canvas-button" href="./canvas.html">Open canvas</a>
    </header>

    <nav class="week-calendar" id="weekCalendar" aria-label="Week calendar"></nav>
    <p class="note">Choose a weekday to view its to-dos. Tasks added in chat appear automatically within a few seconds. Double-tap a task's text to edit it.</p>
    <div class="days" id="days"></div>
  </main>

  <dialog id="taskDialog">
    <form class="dialog-form" id="taskForm">
      <div class="dialog-heading">
        <div>
          <h3 id="dialogTitle">Add a to-do</h3>
          <p class="dialog-description">Choose a time and write the task.</p>
        </div>
        <button class="dialog-close" id="closeTaskDialog" type="button" aria-label="Close add task dialog">&times;</button>
      </div>
      <input type="hidden" id="dayKey">
      <div class="field">
        <label for="taskTime">Time</label>
        <input id="taskTime" name="time" type="time" required>
      </div>
      <div class="field">
        <label for="taskText">To-do</label>
        <input id="taskText" name="text" type="text" maxlength="120" autocomplete="off" required>
      </div>
      <div class="dialog-actions">
        <button class="cancel-button" id="cancelButton" type="button">Cancel</button>
        <button class="save-button" type="submit">Add to-do</button>
      </div>
    </form>
  </dialog>

  <dialog id="deleteTaskDialog">
    <form class="dialog-form" id="deleteTaskForm">
      <div class="dialog-heading">
        <div>
          <h3>Delete this to-do?</h3>
          <p class="dialog-description" id="deleteTaskDescription">This action cannot be undone.</p>
        </div>
        <button class="dialog-close" id="closeDeleteDialog" type="button" aria-label="Close delete dialog">&times;</button>
      </div>
      <div class="dialog-actions">
        <button class="cancel-button" id="cancelDeleteButton" type="button">Cancel</button>
        <button class="danger-button" type="submit">Delete</button>
      </div>
    </form>
  </dialog>

  <div class="visually-hidden" aria-live="polite" id="liveRegion"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "weekly-todo-v1";
    const REMOTE_TASKS_URL = "https://raw.githubusercontent.com/Caccini/weekly-todo/main/tasks.json";
    const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];

    const commonTasks = [
      ["09:30", "X interaction session"],
      ["10:30", "Work on the design system"],
      ["12:00", "Lunch break"],
      ["16:20", "Exploration session"]
    ];

    function mondayOf(date = new Date()) {
      const d = new Date(date);
      d.setHours(0, 0, 0, 0);
      const weekday = d.getDay();
      const delta = weekday === 0 ? -6 : 1 - weekday;
      d.setDate(d.getDate() + delta);
      return d;
    }

    function dateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function shortDate(date) {
      return new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short" }).format(date);
    }

    function fullDate(date) {
      return new Intl.DateTimeFormat("en-GB", {
        day: "numeric",
        month: "long",
        year: "numeric"
      }).format(date);
    }

    function monthLabel(date) {
      return new Intl.DateTimeFormat("en-GB", { month: "short" }).format(date);
    }

    function makeTask(time, text) {
      return {
        id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
        time,
        text,
        done: false
      };
    }

    function defaultWeek(weekStart) {
      const days = {};
      DAYS.forEach((dayName, index) => {
        const key = dayName.toLowerCase();
        const tasks = [];
        if (index > 0) tasks.push(makeTask("08:00", "Gym"));
        commonTasks.forEach(([time, text]) => tasks.push(makeTask(time, text)));

        if (index < 4) {
          tasks.push(makeTask("13:00", `Finish section/footer ${index + 1}`));
          tasks.push(makeTask("15:30", `Prepare X post ${index + 1}`));
          tasks.push(makeTask("17:10", `Publish X post ${index + 1}`));
        } else {
          tasks.push(makeTask("13:00", "Review and polish all four sections/footers"));
          tasks.push(makeTask("15:30", "Review X posts and plan next week's content"));
        }

        days[key] = tasks.sort((a, b) => a.time.localeCompare(b.time));
      });

      return { weekStart: dateKey(weekStart), days };
    }

    function loadState() {
      const thisMonday = mondayOf();
      const expectedKey = dateKey(thisMonday);
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && saved.weekStart === expectedKey && saved.days) return saved;
      } catch (_) {}

      const fresh = defaultWeek(thisMonday);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
      return fresh;
    }

    let state = loadState();
    let pendingTaskDeletion = null;
    let toastTimer = null;
    let activeDayKey = (() => {
      const today = new Date().getDay();
      return today >= 1 && today <= 5 ? DAYS[today - 1].toLowerCase() : "monday";
    })();

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("is-visible");
      document.getElementById("liveRegion").textContent = message;
      toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 2200);
    }

    function closeTaskMenus(except = null) {
      document.querySelectorAll(".task-menu").forEach(menu => {
        if (menu === except) return;
        menu.hidden = true;
        menu.previousElementSibling?.setAttribute("aria-expanded", "false");
      });
    }

    async function syncChatTasks() {
      try {
        const response = await fetch(`${REMOTE_TASKS_URL}?updated=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) return;
        const remote = await response.json();
        if (!remote || remote.weekStart !== state.weekStart || !remote.days) return;

        let added = 0;
        DAYS.forEach(dayName => {
          const dayKey = dayName.toLowerCase();
          const incoming = Array.isArray(remote.days[dayKey]) ? remote.days[dayKey] : [];
          const existingIds = new Set((state.days[dayKey] || []).map(task => task.id));
          incoming.forEach(task => {
            if (!task || !task.id || !task.time || !task.text || existingIds.has(task.id)) return;
            state.days[dayKey].push({
              id: String(task.id),
              time: String(task.time),
              text: String(task.text),
              done: false
            });
            existingIds.add(task.id);
            added += 1;
          });
          state.days[dayKey].sort((a, b) => a.time.localeCompare(b.time));
        });

        if (added) {
          saveState();
          showToast(`${added} task${added === 1 ? "" : "s"} added from chat`);
          render();
        }
      } catch (_) {
        // The planner remains fully usable when offline.
      }
    }

    function taskRow(dayKey, task) {
      const li = document.createElement("li");
      li.className = `task${task.done ? " done" : ""}`;

      const check = document.createElement("input");
      check.type = "checkbox";
      check.checked = task.done;
      check.setAttribute("aria-label", `Mark ${task.text} complete`);
      check.addEventListener("change", () => {
        task.done = check.checked;
        saveState();
        showToast(check.checked ? "Task completed" : "Task marked incomplete");
        render();
      });

      const time = document.createElement("span");
      time.className = "task-time";
      time.textContent = task.time;

      const text = document.createElement("span");
      text.className = "task-text";
      text.textContent = task.text;
      let lastTapAt = 0;

      const editText = () => {
        if (text.dataset.editing === "true") return;
        text.dataset.editing = "true";

        const input = document.createElement("input");
        input.type = "text";
        input.className = "task-text task-text-edit";
        input.value = task.text;
        input.maxLength = 120;
        input.setAttribute("aria-label", `Edit ${task.text}`);

        let finished = false;
        const finish = (save) => {
          if (finished) return;
          finished = true;
          const updated = input.value.trim();
          if (save && updated) {
            task.text = updated;
            saveState();
            showToast("Task updated");
          }
          render();
        };

        input.addEventListener("keydown", event => {
          if (event.key === "Enter") {
            event.preventDefault();
            finish(true);
          }
          if (event.key === "Escape") {
            event.preventDefault();
            finish(false);
          }
        });
        input.addEventListener("blur", () => finish(true));
        text.replaceWith(input);
        input.focus();
        input.select();
      };

      text.addEventListener("dblclick", event => {
        event.preventDefault();
        editText();
      });
      text.addEventListener("touchend", event => {
        const now = Date.now();
        if (now - lastTapAt < 350) {
          event.preventDefault();
          editText();
        }
        lastTapAt = now;
      }, { passive: false });

      const menuWrap = document.createElement("div");
      menuWrap.className = "task-menu-wrap";

      const menuTrigger = document.createElement("button");
      menuTrigger.type = "button";
      menuTrigger.className = "task-menu-trigger";
      menuTrigger.textContent = "⋯";
      menuTrigger.setAttribute("aria-label", `Actions for ${task.text}`);
      menuTrigger.setAttribute("aria-haspopup", "menu");
      menuTrigger.setAttribute("aria-expanded", "false");
      menuTrigger.dataset.tooltip = "Task actions";

      const menu = document.createElement("div");
      menu.className = "task-menu";
      menu.setAttribute("role", "menu");
      menu.hidden = true;

      const editButton = document.createElement("button");
      editButton.type = "button";
      editButton.setAttribute("role", "menuitem");
      editButton.textContent = "Edit task";
      editButton.addEventListener("click", () => {
        closeTaskMenus();
        editText();
      });

      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.className = "danger-action";
      deleteButton.setAttribute("role", "menuitem");
      deleteButton.textContent = "Delete task";
      deleteButton.addEventListener("click", () => {
        closeTaskMenus();
        pendingTaskDeletion = { dayKey, taskId: task.id, text: task.text };
        document.getElementById("deleteTaskDescription").textContent = `“${task.text}” will be permanently removed.`;
        document.getElementById("deleteTaskDialog").showModal();
      });

      menuTrigger.addEventListener("click", event => {
        event.stopPropagation();
        const willOpen = menu.hidden;
        closeTaskMenus(menu);
        menu.hidden = !willOpen;
        menuTrigger.setAttribute("aria-expanded", String(willOpen));
        if (willOpen) editButton.focus();
      });
      menu.addEventListener("click", event => event.stopPropagation());
      menu.append(editButton, deleteButton);
      menuWrap.append(menuTrigger, menu);

      li.append(check, time, text, menuWrap);
      return li;
    }

    function render() {
      const weekStart = new Date(`${state.weekStart}T00:00:00`);
      const friday = new Date(weekStart);
      friday.setDate(friday.getDate() + 4);
      document.getElementById("weekRange").textContent = `Week: ${fullDate(weekStart)} - ${fullDate(friday)}`;

      const calendarRoot = document.getElementById("weekCalendar");
      calendarRoot.replaceChildren();
      DAYS.forEach((dayName, index) => {
        const dayDate = new Date(weekStart);
        dayDate.setDate(dayDate.getDate() + index);
        const dayKey = dayName.toLowerCase();
        const tab = document.createElement("button");
        tab.type = "button";
        tab.className = `calendar-day${activeDayKey === dayKey ? " is-active" : ""}`;
        tab.setAttribute("aria-label", `Show ${dayName}, ${fullDate(dayDate)}`);
        tab.setAttribute("aria-pressed", String(activeDayKey === dayKey));
        tab.innerHTML = `
          <span class="calendar-weekday">${dayName.slice(0, 3)}</span>
          <span class="calendar-number">${dayDate.getDate()}</span>
          <span class="calendar-month">${monthLabel(dayDate)}</span>
        `;
        tab.addEventListener("click", () => {
          activeDayKey = dayKey;
          render();
        });
        calendarRoot.appendChild(tab);
      });

      const daysRoot = document.getElementById("days");
      daysRoot.replaceChildren();

      const activeIndex = DAYS.findIndex(dayName => dayName.toLowerCase() === activeDayKey);
      const dayName = DAYS[activeIndex === -1 ? 0 : activeIndex];
      const index = activeIndex === -1 ? 0 : activeIndex;
      {
        const dayKey = dayName.toLowerCase();
        const dayDate = new Date(weekStart);
        dayDate.setDate(dayDate.getDate() + index);

        const section = document.createElement("section");
        section.className = "day";
        section.id = dayKey;

        const heading = document.createElement("div");
        heading.className = "day-heading";
        heading.innerHTML = `<h2>${dayName}</h2><span class="day-date">${fullDate(dayDate)}</span>`;

        const list = document.createElement("ul");
        list.className = "task-list";
        list.setAttribute("aria-label", `${dayName} to-do list`);

        const tasks = state.days[dayKey] || [];
        if (tasks.length) {
          tasks.forEach(task => list.appendChild(taskRow(dayKey, task)));
        } else {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "No to-dos yet.";
          list.appendChild(empty);
        }

        const addRow = document.createElement("div");
        addRow.className = "add-row";
        const addButton = document.createElement("button");
        addButton.type = "button";
        addButton.className = "add-task";
        addButton.textContent = "+ Add to-do";
        addButton.addEventListener("click", () => openDialog(dayKey, dayName));
        addRow.appendChild(addButton);

        section.append(heading, list, addRow);
        daysRoot.appendChild(section);
      }
    }

    const dialog = document.getElementById("taskDialog");
    const form = document.getElementById("taskForm");

    function openDialog(dayKey, dayName) {
      document.getElementById("dayKey").value = dayKey;
      document.getElementById("dialogTitle").textContent = `Add a to-do for ${dayName}`;
      form.reset();
      document.getElementById("dayKey").value = dayKey;
      dialog.showModal();
      document.getElementById("taskTime").focus();
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const dayKey = document.getElementById("dayKey").value;
      const time = document.getElementById("taskTime").value;
      const text = document.getElementById("taskText").value.trim();
      if (!dayKey || !time || !text) return;
      state.days[dayKey].push(makeTask(time, text));
      state.days[dayKey].sort((a, b) => a.time.localeCompare(b.time));
      saveState();
      dialog.close();
      showToast("Task added");
      render();
    });

    document.getElementById("cancelButton").addEventListener("click", () => dialog.close());
    document.getElementById("closeTaskDialog").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", event => {
      if (event.target === dialog) dialog.close();
    });

    const deleteTaskDialog = document.getElementById("deleteTaskDialog");
    document.getElementById("deleteTaskForm").addEventListener("submit", event => {
      event.preventDefault();
      if (!pendingTaskDeletion) return;
      const { dayKey, taskId } = pendingTaskDeletion;
      state.days[dayKey] = state.days[dayKey].filter(item => item.id !== taskId);
      pendingTaskDeletion = null;
      saveState();
      deleteTaskDialog.close();
      showToast("Task deleted");
      render();
    });
    const closeDeleteDialog = () => {
      pendingTaskDeletion = null;
      deleteTaskDialog.close();
    };
    document.getElementById("cancelDeleteButton").addEventListener("click", closeDeleteDialog);
    document.getElementById("closeDeleteDialog").addEventListener("click", closeDeleteDialog);
    deleteTaskDialog.addEventListener("click", event => {
      if (event.target === deleteTaskDialog) closeDeleteDialog();
    });

    document.addEventListener("click", () => closeTaskMenus());
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeTaskMenus();
    });

    // Reset automatically after the week changes, even if the app stays open.
    setInterval(() => {
      const currentKey = dateKey(mondayOf());
      if (currentKey !== state.weekStart) {
        state = defaultWeek(mondayOf());
        activeDayKey = "monday";
        saveState();
        render();
      } else {
        syncChatTasks();
      }
    }, 5000);

    render();
    syncChatTasks();

    function refreshFromChatWhenAppReturns() {
      syncChatTasks();
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistration().then(registration => registration?.update()).catch(() => {});
      }
    }

    window.addEventListener("pageshow", refreshFromChatWhenAppReturns);
    window.addEventListener("focus", refreshFromChatWhenAppReturns);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") refreshFromChatWhenAppReturns();
    });

    let pullStartY = null;
    window.addEventListener("touchstart", event => {
      if (window.scrollY <= 0) pullStartY = event.touches[0]?.clientY ?? null;
    }, { passive: true });
    window.addEventListener("touchend", event => {
      const endY = event.changedTouches[0]?.clientY ?? null;
      const pulledFarEnough = pullStartY !== null && endY !== null && endY - pullStartY > 70;
      pullStartY = null;
      if (pulledFarEnough && window.scrollY <= 0) syncChatTasks();
    }, { passive: true });

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
