<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Canvas</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --paper: #ffffff;
      --line: #d9d9d9;
      --muted: #666666;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    button,
    a { font: inherit; }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    #canvas.is-dragging { cursor: grabbing; }

    .topbar {
      position: fixed;
      z-index: 2;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .pill {
      min-height: 44px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: rgba(255, 255, 255, .94);
      color: var(--ink);
      box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
      pointer-events: auto;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 16px;
      font-weight: 650;
      text-decoration: none;
    }

    .back:hover,
    .back:focus-visible,
    .zoom button:hover,
    .zoom button:focus-visible {
      background: var(--ink);
      color: var(--paper);
    }

    .back:focus-visible,
    .zoom button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
    }

    .zoom {
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .zoom button {
      width: 44px;
      height: 42px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 21px;
      cursor: pointer;
    }

    .zoom-output {
      min-width: 60px;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .hint {
      position: fixed;
      z-index: 2;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      margin: 0;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .92);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="Infinite canvas. Drag to move and pinch or scroll to zoom."></canvas>

  <div class="topbar">
    <a class="pill back" href="./index.html" aria-label="Back to daily to-do">← Back</a>
    <div class="pill zoom" aria-label="Canvas zoom controls">
      <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
      <span class="zoom-output" id="zoomOutput">100%</span>
      <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
    </div>
  </div>

  <p class="hint">Drag to move · Pinch or scroll to zoom</p>

  <script>
    const canvas = document.getElementById("canvas");
    const context = canvas.getContext("2d");
    const zoomOutput = document.getElementById("zoomOutput");
    const pointers = new Map();

    let width = 0;
    let height = 0;
    let pixelRatio = 1;
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let lastPoint = null;
    let pinchDistance = null;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      draw();
    }

    function draw() {
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      context.clearRect(0, 0, width, height);
      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, width, height);

      const step = 32 * scale;
      const dotRadius = Math.max(.8, 1.15 * scale);
      const startX = ((offsetX % step) + step) % step;
      const startY = ((offsetY % step) + step) % step;

      context.fillStyle = "#d8d8d8";
      for (let x = startX; x < width; x += step) {
        for (let y = startY; y < height; y += step) {
          context.beginPath();
          context.arc(x, y, dotRadius, 0, Math.PI * 2);
          context.fill();
        }
      }

      zoomOutput.textContent = `${Math.round(scale * 100)}%`;
    }

    function zoomAt(nextScale, x = width / 2, y = height / 2) {
      const bounded = Math.min(4, Math.max(.2, nextScale));
      const ratio = bounded / scale;
      offsetX = x - (x - offsetX) * ratio;
      offsetY = y - (y - offsetY) * ratio;
      scale = bounded;
      draw();
    }

    function distanceBetween(points) {
      const [first, second] = points;
      return Math.hypot(second.x - first.x, second.y - first.y);
    }

    function midpoint(points) {
      const [first, second] = points;
      return { x: (first.x + second.x) / 2, y: (first.y + second.y) / 2 };
    }

    canvas.addEventListener("pointerdown", event => {
      canvas.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      lastPoint = { x: event.clientX, y: event.clientY };
      canvas.classList.add("is-dragging");
      if (pointers.size === 2) pinchDistance = distanceBetween([...pointers.values()]);
    });

    canvas.addEventListener("pointermove", event => {
      if (!pointers.has(event.pointerId)) return;
      const previous = pointers.get(event.pointerId);
      const current = { x: event.clientX, y: event.clientY };
      pointers.set(event.pointerId, current);

      if (pointers.size === 1 && lastPoint) {
        offsetX += current.x - lastPoint.x;
        offsetY += current.y - lastPoint.y;
        lastPoint = current;
        draw();
        return;
      }

      if (pointers.size === 2) {
        const points = [...pointers.values()];
        const nextDistance = distanceBetween(points);
        const center = midpoint(points);
        if (pinchDistance) zoomAt(scale * (nextDistance / pinchDistance), center.x, center.y);
        offsetX += current.x - previous.x;
        offsetY += current.y - previous.y;
        pinchDistance = nextDistance;
        draw();
      }
    });

    function releasePointer(event) {
      pointers.delete(event.pointerId);
      if (pointers.size === 1) lastPoint = [...pointers.values()][0];
      if (pointers.size < 2) pinchDistance = null;
      if (pointers.size === 0) {
        lastPoint = null;
        canvas.classList.remove("is-dragging");
      }
    }

    canvas.addEventListener("pointerup", releasePointer);
    canvas.addEventListener("pointercancel", releasePointer);

    canvas.addEventListener("wheel", event => {
      event.preventDefault();
      zoomAt(scale * Math.exp(-event.deltaY * .0015), event.clientX, event.clientY);
    }, { passive: false });

    document.getElementById("zoomIn").addEventListener("click", () => zoomAt(scale * 1.2));
    document.getElementById("zoomOut").addEventListener("click", () => zoomAt(scale / 1.2));
    window.addEventListener("resize", resize);
    resize();
  </script>
</body>
</html>
