<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="nowy">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/Caccini/weekly-todo/main/app-icon-padded-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/Caccini/weekly-todo/main/apple-touch-icon-padded.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://raw.githubusercontent.com/Caccini/weekly-todo/main/apple-touch-icon-padded.png">
  <title>nowy Canvas</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17171a;
      --paper: #fbfafc;
      --card: #ffffff;
      --line: #e8e7eb;
      --muted: #77767d;
      --soft: #f4f3f5;
      --blue: #3599df;
      --lilac: #eee4ff;
      --danger: #a43b3b;
      --shadow: 0 8px 28px rgba(41, 37, 48, .08);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    button,
    a,
    label { font: inherit; }

    button,
    .button {
      min-height: 44px;
      padding: 0 15px;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }

    button:disabled {
      color: #aaaaaa;
      cursor: default;
    }

    button:focus-visible,
    a:focus-visible,
    label:focus-within {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
    }

    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background-color: var(--paper);
      background-image: radial-gradient(circle, rgba(118, 110, 135, .2) 1px, transparent 1.15px);
      touch-action: none;
      cursor: grab;
    }

    .viewport.is-panning { cursor: grabbing; }
    .viewport.is-drawing { cursor: crosshair; }
    .viewport.is-dropping::after {
      content: "Drop images here";
      position: fixed;
      inset: 18px;
      display: grid;
      place-items: center;
      border: 2px dashed #9470e7;
      border-radius: 28px;
      background: rgba(247, 243, 255, .9);
      color: #6849ad;
      font-size: 20px;
      font-weight: 700;
      pointer-events: none;
      z-index: 6;
    }

    .world {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform-origin: 0 0;
      pointer-events: none;
      will-change: transform;
    }

    .ink-layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      overflow: visible;
      pointer-events: none;
    }

    .ink-layer path {
      fill: none;
      stroke: var(--ink);
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .items-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .image-item {
      position: absolute;
      left: 0;
      top: 0;
      border: 2px solid transparent;
      border-radius: 14px;
      background: var(--paper);
      box-shadow: 0 12px 34px rgba(49, 42, 61, .13);
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .image-item.is-selected {
      border-color: var(--blue);
    }

    .image-item.is-held {
      border-color: var(--blue);
      cursor: grabbing;
    }

    .image-item img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 11px;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .resize-handle {
      position: absolute;
      right: -12px;
      bottom: -12px;
      display: none;
      width: 24px;
      height: 24px;
      border: 2px solid var(--blue);
      border-radius: 50%;
      background: var(--paper);
      cursor: nwse-resize;
      pointer-events: auto;
    }

    .image-item.is-selected .resize-handle { display: block; }

    .topbar {
      position: fixed;
      z-index: 8;
      top: max(18px, env(safe-area-inset-top));
      left: max(20px, env(safe-area-inset-left));
      right: max(20px, env(safe-area-inset-right));
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
      min-height: 54px;
      pointer-events: none;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 9px;
      width: max-content;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      pointer-events: auto;
    }

    .brand-mini img {
      width: 28px;
      height: 28px;
      border-radius: 9px;
    }

    .mode-switcher {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 8px 30px rgba(48, 44, 54, .08);
      pointer-events: auto;
    }

    .mode-switcher a {
      display: grid;
      min-height: 40px;
      padding: 0 20px;
      border-radius: 999px;
      color: var(--ink);
      font-weight: 650;
      place-items: center;
      text-decoration: none;
    }

    .mode-switcher a:hover { background: var(--soft); }
    .mode-switcher .is-active { background: #efeff1; color: var(--blue); }
    .mode-switcher .canvas-tab { padding-inline: 17px; }

    .mode-switcher .chat-tab {
      display: flex;
      gap: 8px;
      padding-right: 7px;
    }

    .chat-avatar {
      display: grid;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(145deg, #f1e6ff, #d8d8ff);
      color: #5e44a8;
      font-size: 15px;
      place-items: center;
    }

    .header-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      pointer-events: auto;
    }

    .pill {
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, .94);
      color: var(--ink);
      box-shadow: var(--shadow);
      pointer-events: auto;
    }

    .zoom button:hover:not(:disabled),
    .zoom button:focus-visible {
      background: var(--soft);
      color: var(--blue);
    }

    .zoom {
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .zoom button {
      width: 44px;
      height: 42px;
      padding: 0;
      font-size: 21px;
    }

    .zoom-output {
      min-width: 58px;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .tools-toggle { display: none; }

    .tools {
      position: fixed;
      z-index: 8;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      max-width: calc(100% - 24px);
      overflow-x: auto;
      transform: translateX(-50%);
      white-space: nowrap;
      scrollbar-width: none;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 10px 34px rgba(48, 44, 54, .11);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .tools::-webkit-scrollbar { display: none; }

    .tools-sheet-header { display: none; }

    .tools-content {
      display: flex;
      align-items: center;
    }

    .tools button,
    .tools .button {
      border-right: 1px solid var(--line);
      border-radius: 0;
      font-weight: 600;
    }

    .tools-content > :first-child {
      border-radius: 999px 0 0 999px;
    }

    .tools-content > :last-child {
      border-right: 0;
      border-radius: 0 999px 999px 0;
    }

    .tools .is-active .icon-surface {
      background: #efeff1;
      color: var(--blue);
    }

    .tools .icon-button,
    .tools .button.icon-button {
      display: inline-grid;
      width: 50px;
      min-width: 50px;
      height: 46px;
      min-height: 46px;
      padding: 0;
      place-items: center;
      line-height: 1;
    }

    .icon-surface {
      display: grid;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      place-items: center;
      transition: background-color 120ms ease, color 120ms ease;
      pointer-events: none;
    }

    .tools .icon-button:hover:not(:disabled) .icon-surface,
    .tools .button.icon-button:hover .icon-surface,
    .tools .icon-button:focus-visible .icon-surface,
    .tools .button.icon-button:focus-within .icon-surface {
      background: var(--soft);
      color: var(--ink);
    }

    .tools .icon-button.is-active:hover .icon-surface,
    .tools .icon-button.is-active:focus-visible .icon-surface {
      background: #efeff1;
      color: var(--blue);
    }

    .tool-icon {
      display: block;
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .plus-icon {
      font-size: 28px;
      font-weight: 350;
      line-height: 1;
      transform: translateY(-1px);
    }

    .upload input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .empty-hint {
      position: fixed;
      z-index: 1;
      left: 50%;
      top: 50%;
      display: grid;
      max-width: min(440px, calc(100% - 48px));
      padding: 20px 24px;
      border-radius: 24px;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, .78);
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      text-align: center;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      pointer-events: none;
    }

    .empty-hint strong {
      margin-bottom: 5px;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -.025em;
    }

    .empty-hint[hidden] { display: none; }

    .status {
      position: fixed;
      z-index: 9;
      left: 50%;
      top: max(72px, calc(env(safe-area-inset-top) + 58px));
      transform: translateX(-50%);
      margin: 0;
      padding: 8px 12px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, .96);
      color: var(--muted);
      font-size: 13px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease;
    }

    .status.is-visible { opacity: 1; }

    .sheet-backdrop {
      position: fixed;
      z-index: 7;
      inset: 0;
      display: none;
      background: rgba(0, 0, 0, .28);
    }

    dialog {
      width: min(420px, calc(100% - 32px));
      padding: 0;
      border: 0;
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .18);
    }

    dialog::backdrop { background: rgba(0, 0, 0, .34); }

    .dialog-form { padding: 22px; }
    .dialog-form h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 26px; font-weight: 500; }
    .dialog-form p { margin: 7px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
    .dialog-actions button { border: 0; border-radius: 999px; background: var(--soft); }
    .dialog-actions .danger-button { background: var(--danger); border-color: var(--danger); color: var(--paper); }

    [data-tooltip] { position: relative; }

    @media (hover: hover) {
      [data-tooltip]::after {
        content: attr(data-tooltip);
        position: absolute;
        z-index: 20;
        left: 50%;
        bottom: calc(100% + 8px);
        width: max-content;
        max-width: 180px;
        padding: 6px 8px;
        border-radius: 6px;
        background: var(--ink);
        color: var(--paper);
        font-size: 12px;
        line-height: 1.2;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 3px);
        transition: opacity 120ms ease, transform 120ms ease;
      }

      [data-tooltip-position="bottom"]::after { top: calc(100% + 8px); bottom: auto; }
      [data-tooltip]:hover::after,
      [data-tooltip]:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
    }

    @media (max-width: 620px) {
      .topbar {
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
        grid-template-columns: 1fr auto;
        gap: 10px;
      }
      .brand-mini { display: none; }
      .mode-switcher { justify-self: start; }
      .mode-switcher a { padding: 0 9px; font-size: 14px; }
      .mode-switcher .canvas-tab { padding-inline: 9px; }
      .mode-switcher .chat-tab { padding-right: 5px; }
      .mode-switcher .chat-tab > span:first-child { display: none; }
      .tools-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 650;
      }
      .topbar .zoom { display: none; }
      .tools {
        left: 12px;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        display: block;
        max-width: none;
        overflow: hidden;
        border-radius: 18px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(calc(100% + 34px));
        transition: opacity 160ms ease, transform 200ms ease;
      }
      .tools.is-open {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }
      .sheet-backdrop.is-visible { display: block; }
      .tools-sheet-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px 8px;
        font-weight: 700;
      }
      .tools-sheet-header button {
        width: 36px;
        min-height: 36px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        color: var(--muted);
        font-size: 22px;
      }
      .tools-content {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 8px 12px 12px;
      }
      .tools button,
      .tools .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      .tools .icon-button,
      .tools .button.icon-button {
        width: 100%;
        min-width: 0;
      }
      .empty-hint { font-size: 14px; }
    }
  </style>
</head>
<body>
  <main class="viewport" id="viewport" aria-label="Infinite moodboard canvas">
    <div class="world" id="world">
      <svg class="ink-layer" id="inkLayer" aria-hidden="true"></svg>
      <div class="items-layer" id="itemsLayer"></div>
    </div>
    <p class="empty-hint" id="emptyHint"><strong>Build your moodboard</strong><span>Add images, draw with your Apple Pencil, or touch and hold an image to move it.</span></p>
  </main>

  <div class="topbar">
    <div class="brand-mini">
      <img src="./app-icon-padded-192.png" alt="">
      <span>nowy</span>
    </div>
    <nav class="mode-switcher" aria-label="App sections">
      <a href="./index.html?view=notes">Notes</a>
      <a href="./index.html?view=today">Today</a>
      <a href="./index.html?view=focus">Focus</a>
      <a class="canvas-tab is-active" href="./canvas.html" aria-current="page">Canvas</a>
      <a class="chat-tab" href="./index.html?view=chat"><span>Chat</span><span class="chat-avatar" aria-hidden="true">✦</span></a>
    </nav>
    <div class="header-actions">
      <div class="pill zoom" aria-label="Canvas zoom controls">
        <button id="zoomOut" type="button" aria-label="Zoom out" data-tooltip="Zoom out" data-tooltip-position="bottom">−</button>
        <span class="zoom-output" id="zoomOutput">100%</span>
        <button id="zoomIn" type="button" aria-label="Zoom in" data-tooltip="Zoom in" data-tooltip-position="bottom">+</button>
      </div>
      <button class="pill tools-toggle" id="toolsToggle" type="button" aria-controls="toolsPanel" aria-expanded="false">Tools</button>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>

  <div class="pill tools" id="toolsPanel" aria-label="Moodboard tools">
    <div class="tools-sheet-header">
      <span>Canvas tools</span>
      <button id="closeTools" type="button" aria-label="Close canvas tools">&times;</button>
    </div>
    <div class="tools-content" role="toolbar" aria-label="Moodboard tools">
      <button class="icon-button" id="penTool" type="button" aria-label="Pen tool" aria-pressed="false" data-tooltip="Pen tool">
        <span class="icon-surface">
          <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3 19 10l-5 11h-4L5 10l7-7Z"></path>
            <path d="M12 3v9"></path>
            <circle cx="12" cy="14.5" r="1.5"></circle>
          </svg>
        </span>
      </button>
      <label class="button icon-button upload" for="imageInput" aria-label="Add images" data-tooltip="Add images">
        <span class="icon-surface"><span class="plus-icon" aria-hidden="true">+</span></span>
        <input id="imageInput" type="file" accept="image/*" multiple>
      </label>
      <button class="icon-button" id="undoButton" type="button" aria-label="Undo" data-tooltip="Undo" disabled>
        <span class="icon-surface">
          <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 7-4 4 4 4"></path>
            <path d="M5 11h8a6 6 0 0 1 6 6v1"></path>
          </svg>
        </span>
      </button>
      <button class="icon-button" id="deleteButton" type="button" aria-label="Delete selected image" data-tooltip="Delete selected image" disabled>
        <span class="icon-surface">
          <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16"></path>
            <path d="M9 7V4h6v3"></path>
            <path d="m6 7 1 13h10l1-13"></path>
            <path d="M10 11v5M14 11v5"></path>
          </svg>
        </span>
      </button>
    </div>
  </div>

  <p class="status" id="status" aria-live="polite"></p>

  <dialog id="deleteImageDialog">
    <form class="dialog-form" id="deleteImageForm">
      <h2>Delete this image?</h2>
      <p>The selected image will be removed from your moodboard. You can still use Undo immediately afterward.</p>
      <div class="dialog-actions">
        <button id="cancelImageDelete" type="button">Cancel</button>
        <button class="danger-button" type="submit">Delete</button>
      </div>
    </form>
  </dialog>

  <script>
    const viewport = document.getElementById("viewport");
    const world = document.getElementById("world");
    const inkLayer = document.getElementById("inkLayer");
    const itemsLayer = document.getElementById("itemsLayer");
    const zoomOutput = document.getElementById("zoomOutput");
    const penTool = document.getElementById("penTool");
    const imageInput = document.getElementById("imageInput");
    const undoButton = document.getElementById("undoButton");
    const deleteButton = document.getElementById("deleteButton");
    const emptyHint = document.getElementById("emptyHint");
    const status = document.getElementById("status");
    const toolsPanel = document.getElementById("toolsPanel");
    const toolsToggle = document.getElementById("toolsToggle");
    const sheetBackdrop = document.getElementById("sheetBackdrop");
    const deleteImageDialog = document.getElementById("deleteImageDialog");

    const DB_NAME = "weekly-todo-moodboard";
    const STORE_NAME = "boards";
    const BOARD_KEY = "main";
    const GRID_SIZE = 32;
    const MIN_SCALE = .2;
    const MAX_SCALE = 4;

    let scale = 1;
    let offsetX = window.innerWidth / 2;
    let offsetY = window.innerHeight / 2;
    let mode = "move";
    let images = [];
    let strokes = [];
    let selectedImageId = null;
    let activeStroke = null;
    let statusTimer = null;
    let databasePromise = null;
    const pointers = new Map();
    const history = [];
    let panStart = null;
    let pinchStart = null;

    function uid(prefix) {
      return prefix + "-" + Date.now() + "-" + Math.random().toString(36).slice(2);
    }

    function openDatabase() {
      if (databasePromise) return databasePromise;
      databasePromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: "id" });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      return databasePromise;
    }

    async function saveBoard() {
      try {
        const db = await openDatabase();
        const transaction = db.transaction(STORE_NAME, "readwrite");
        transaction.objectStore(STORE_NAME).put({
          id: BOARD_KEY,
          images,
          strokes
        });
      } catch (_) {
        showStatus("Could not save on this device");
      }
    }

    async function loadBoard() {
      try {
        const db = await openDatabase();
        const transaction = db.transaction(STORE_NAME, "readonly");
        const request = transaction.objectStore(STORE_NAME).get(BOARD_KEY);
        const board = await new Promise((resolve, reject) => {
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        if (board) {
          images = Array.isArray(board.images) ? board.images : [];
          strokes = Array.isArray(board.strokes) ? board.strokes : [];
        }
      } catch (_) {
        showStatus("Could not load the saved moodboard");
      }
      renderAll();
    }

    function showStatus(message) {
      clearTimeout(statusTimer);
      status.textContent = message;
      status.classList.add("is-visible");
      statusTimer = setTimeout(() => status.classList.remove("is-visible"), 1800);
    }

    function setToolsOpen(open) {
      toolsPanel.classList.toggle("is-open", open);
      sheetBackdrop.classList.toggle("is-visible", open);
      toolsToggle.setAttribute("aria-expanded", String(open));
    }

    function screenToWorld(x, y) {
      return {
        x: (x - offsetX) / scale,
        y: (y - offsetY) / scale
      };
    }

    function renderView() {
      world.style.transform = `translate3d(${offsetX}px, ${offsetY}px, 0) scale(${scale})`;
      viewport.style.backgroundSize = `${GRID_SIZE * scale}px ${GRID_SIZE * scale}px`;
      viewport.style.backgroundPosition = `${offsetX}px ${offsetY}px`;
      zoomOutput.textContent = Math.round(scale * 100) + "%";
    }

    function renderStrokes() {
      inkLayer.replaceChildren();
      strokes.forEach(stroke => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.dataset.id = stroke.id;
        path.setAttribute("d", pathFromPoints(stroke.points));
        path.setAttribute("stroke-width", String(stroke.width || 3.5));
        inkLayer.appendChild(path);
      });
    }

    function pathFromPoints(points) {
      if (!points || !points.length) return "";
      if (points.length === 1) {
        const point = points[0];
        return `M ${point.x} ${point.y} l .01 .01`;
      }
      let path = `M ${points[0].x} ${points[0].y}`;
      for (let index = 1; index < points.length - 1; index += 1) {
        const point = points[index];
        const next = points[index + 1];
        path += ` Q ${point.x} ${point.y} ${(point.x + next.x) / 2} ${(point.y + next.y) / 2}`;
      }
      const last = points[points.length - 1];
      return path + ` L ${last.x} ${last.y}`;
    }

    function renderImages() {
      itemsLayer.replaceChildren();
      images.forEach(image => {
        const item = document.createElement("div");
        item.className = "image-item" + (image.id === selectedImageId ? " is-selected" : "");
        item.dataset.id = image.id;
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute("aria-label", "Moodboard image. Drag to move.");
        item.style.transform = `translate(${image.x}px, ${image.y}px)`;
        item.style.width = image.width + "px";
        item.style.height = image.height + "px";

        const element = document.createElement("img");
        element.src = image.src;
        element.alt = image.name || "Moodboard image";
        element.draggable = false;

        const handle = document.createElement("span");
        handle.className = "resize-handle";
        handle.setAttribute("aria-hidden", "true");

        item.append(element, handle);
        item.addEventListener("pointerdown", startImageMove);
        handle.addEventListener("pointerdown", startImageResize);
        item.addEventListener("keydown", event => {
          if (event.key === "Delete" || event.key === "Backspace") deleteSelectedImage();
        });
        itemsLayer.appendChild(item);
      });
      deleteButton.disabled = !selectedImageId;
      emptyHint.hidden = images.length > 0 || strokes.length > 0;
    }

    function renderAll() {
      renderView();
      renderStrokes();
      renderImages();
      undoButton.disabled = history.length === 0;
    }

    function setMode(nextMode) {
      mode = nextMode;
      penTool.classList.toggle("is-active", mode === "pen");
      penTool.setAttribute("aria-pressed", String(mode === "pen"));
      viewport.classList.toggle("is-drawing", mode === "pen");
      selectedImageId = null;
      renderImages();
      showStatus(mode === "pen" ? "Pen mode on" : "Pen mode off");
    }

    function zoomAt(nextScale, x = window.innerWidth / 2, y = window.innerHeight / 2) {
      const bounded = Math.min(MAX_SCALE, Math.max(MIN_SCALE, nextScale));
      const worldPoint = screenToWorld(x, y);
      scale = bounded;
      offsetX = x - worldPoint.x * scale;
      offsetY = y - worldPoint.y * scale;
      renderView();
    }

    function pushHistory(action) {
      history.push(action);
      if (history.length > 40) history.shift();
      undoButton.disabled = false;
    }

    async function undo() {
      const action = history.pop();
      if (!action) return;
      if (action.type === "add-images") {
        images = images.filter(image => !action.ids.includes(image.id));
        if (action.ids.includes(selectedImageId)) selectedImageId = null;
      } else if (action.type === "stroke") {
        strokes = strokes.filter(stroke => stroke.id !== action.id);
      } else if (action.type === "image-change") {
        const image = images.find(candidate => candidate.id === action.id);
        if (image) Object.assign(image, action.before);
      } else if (action.type === "delete-image") {
        images.push(action.image);
      }
      await saveBoard();
      renderAll();
      showStatus("Last change undone");
    }

    function dataUrlForFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    function dimensionsForSource(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve({ width: image.naturalWidth, height: image.naturalHeight });
        image.onerror = reject;
        image.src = src;
      });
    }

    async function addImageFiles(files, screenPoint = null) {
      const validFiles = [...files].filter(file => file.type && file.type.startsWith("image/"));
      if (!validFiles.length) {
        showStatus("Choose image files");
        return;
      }

      const center = screenPoint || { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      const worldCenter = screenToWorld(center.x, center.y);
      const addedIds = [];

      for (let index = 0; index < validFiles.length; index += 1) {
        try {
          const file = validFiles[index];
          const src = await dataUrlForFile(file);
          const natural = await dimensionsForSource(src);
          const width = Math.min(360, Math.max(140, natural.width));
          const height = width * (natural.height / natural.width);
          const item = {
            id: uid("image"),
            name: file.name,
            src,
            x: worldCenter.x - width / 2 + index * 28,
            y: worldCenter.y - height / 2 + index * 28,
            width,
            height,
            aspect: natural.width / natural.height
          };
          images.push(item);
          addedIds.push(item.id);
          selectedImageId = item.id;
        } catch (_) {
          showStatus("One image could not be added");
        }
      }

      if (addedIds.length) {
        pushHistory({ type: "add-images", ids: addedIds });
        await saveBoard();
        renderAll();
        showStatus(addedIds.length === 1 ? "Image added" : addedIds.length + " images added");
      }
      imageInput.value = "";
    }

    function startImageMove(event) {
      if (event.pointerType === "pen" || event.target.classList.contains("resize-handle")) return;
      event.preventDefault();
      event.stopPropagation();
      const element = event.currentTarget;
      const id = element.dataset.id;
      const image = images.find(candidate => candidate.id === id);
      if (!image) return;
      selectedImageId = id;
      renderImages();
      const activeElement = itemsLayer.querySelector(`[data-id="${id}"]`);
      activeElement.setPointerCapture(event.pointerId);
      const start = { x: event.clientX, y: event.clientY };
      const before = { x: image.x, y: image.y, width: image.width, height: image.height };
      let moving = event.pointerType === "mouse";
      let holdTimer = null;

      const enableMove = () => {
        moving = true;
        activeElement.classList.add("is-held");
        if (event.pointerType === "touch") showStatus("Move enabled");
      };

      if (moving) {
        enableMove();
      } else {
        holdTimer = setTimeout(enableMove, 260);
      }

      function move(moveEvent) {
        if (!moving) {
          const distance = Math.hypot(moveEvent.clientX - start.x, moveEvent.clientY - start.y);
          if (distance > 10) {
            clearTimeout(holdTimer);
            holdTimer = null;
          }
          return;
        }
        image.x = before.x + (moveEvent.clientX - start.x) / scale;
        image.y = before.y + (moveEvent.clientY - start.y) / scale;
        activeElement.style.transform = `translate(${image.x}px, ${image.y}px)`;
      }

      async function finish() {
        clearTimeout(holdTimer);
        activeElement.classList.remove("is-held");
        activeElement.removeEventListener("pointermove", move);
        activeElement.removeEventListener("pointerup", finish);
        activeElement.removeEventListener("pointercancel", finish);
        if (image.x !== before.x || image.y !== before.y) {
          pushHistory({ type: "image-change", id, before });
          await saveBoard();
        }
      }

      activeElement.addEventListener("pointermove", move);
      activeElement.addEventListener("pointerup", finish);
      activeElement.addEventListener("pointercancel", finish);
    }

    function startImageResize(event) {
      event.preventDefault();
      event.stopPropagation();
      const itemElement = event.currentTarget.parentElement;
      const id = itemElement.dataset.id;
      const image = images.find(candidate => candidate.id === id);
      if (!image) return;
      const handle = event.currentTarget;
      handle.setPointerCapture(event.pointerId);
      const startX = event.clientX;
      const before = { x: image.x, y: image.y, width: image.width, height: image.height };

      function resize(moveEvent) {
        image.width = Math.max(80, before.width + (moveEvent.clientX - startX) / scale);
        image.height = image.width / (image.aspect || before.width / before.height);
        itemElement.style.width = image.width + "px";
        itemElement.style.height = image.height + "px";
      }

      async function finish() {
        handle.removeEventListener("pointermove", resize);
        handle.removeEventListener("pointerup", finish);
        handle.removeEventListener("pointercancel", finish);
        if (image.width !== before.width) {
          pushHistory({ type: "image-change", id, before });
          await saveBoard();
        }
      }

      handle.addEventListener("pointermove", resize);
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    }

    async function deleteSelectedImage() {
      if (!selectedImageId) return;
      const index = images.findIndex(image => image.id === selectedImageId);
      if (index < 0) return;
      const [removed] = images.splice(index, 1);
      pushHistory({ type: "delete-image", image: removed });
      selectedImageId = null;
      await saveBoard();
      renderAll();
      showStatus("Image deleted");
    }

    function requestDeleteSelectedImage() {
      if (!selectedImageId || deleteImageDialog.open) return;
      deleteImageDialog.showModal();
    }

    function shouldDraw(event) {
      return event.pointerType === "pen" || mode === "pen";
    }

    function beginStroke(event) {
      const point = screenToWorld(event.clientX, event.clientY);
      activeStroke = {
        id: uid("stroke"),
        pointerId: event.pointerId,
        points: [point],
        width: event.pointerType === "pen" && event.pressure ? 2.5 + event.pressure * 3 : 3.5
      };
      strokes.push(activeStroke);
      renderStrokes();
      viewport.setPointerCapture(event.pointerId);
    }

    function continueStroke(event) {
      if (!activeStroke || activeStroke.pointerId !== event.pointerId) return;
      const events = event.getCoalescedEvents ? event.getCoalescedEvents() : [event];
      events.forEach(pointEvent => {
        const point = screenToWorld(pointEvent.clientX, pointEvent.clientY);
        const previous = activeStroke.points[activeStroke.points.length - 1];
        if (!previous || Math.hypot(point.x - previous.x, point.y - previous.y) > .6) activeStroke.points.push(point);
      });
      const path = inkLayer.querySelector(`[data-id="${activeStroke.id}"]`);
      if (path) path.setAttribute("d", pathFromPoints(activeStroke.points));
    }

    async function finishStroke(event) {
      if (!activeStroke || activeStroke.pointerId !== event.pointerId) return;
      const id = activeStroke.id;
      activeStroke = null;
      pushHistory({ type: "stroke", id });
      await saveBoard();
      renderAll();
    }

    viewport.addEventListener("pointerdown", event => {
      if (event.target.closest(".image-item") && event.pointerType !== "pen") return;

      if (shouldDraw(event)) {
        event.preventDefault();
        event.stopPropagation();
        selectedImageId = null;
        renderImages();
        beginStroke(event);
        return;
      }

      if (event.target.closest(".image-item")) return;
      selectedImageId = null;
      renderImages();
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      viewport.setPointerCapture(event.pointerId);
      viewport.classList.add("is-panning");

      if (pointers.size === 1) {
        panStart = { x: event.clientX, y: event.clientY };
      } else if (pointers.size === 2) {
        const points = [...pointers.values()];
        pinchStart = {
          distance: Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y),
          scale,
          centerX: (points[0].x + points[1].x) / 2,
          centerY: (points[0].y + points[1].y) / 2
        };
      }
    }, { capture: true });

    viewport.addEventListener("pointermove", event => {
      if (activeStroke) {
        continueStroke(event);
        return;
      }
      if (!pointers.has(event.pointerId)) return;
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

      if (pointers.size === 1 && panStart) {
        offsetX += event.clientX - panStart.x;
        offsetY += event.clientY - panStart.y;
        panStart = { x: event.clientX, y: event.clientY };
        renderView();
      } else if (pointers.size === 2 && pinchStart) {
        const points = [...pointers.values()];
        const distance = Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
        const centerX = (points[0].x + points[1].x) / 2;
        const centerY = (points[0].y + points[1].y) / 2;
        offsetX += centerX - pinchStart.centerX;
        offsetY += centerY - pinchStart.centerY;
        zoomAt(pinchStart.scale * (distance / pinchStart.distance), centerX, centerY);
        pinchStart.centerX = centerX;
        pinchStart.centerY = centerY;
        pinchStart.scale = scale;
        pinchStart.distance = distance;
      }
    });

    async function releasePointer(event) {
      if (activeStroke) await finishStroke(event);
      pointers.delete(event.pointerId);
      if (pointers.size === 1) {
        const remaining = [...pointers.values()][0];
        panStart = { x: remaining.x, y: remaining.y };
        pinchStart = null;
      } else if (pointers.size === 0) {
        panStart = null;
        pinchStart = null;
        viewport.classList.remove("is-panning");
      }
    }

    viewport.addEventListener("pointerup", releasePointer);
    viewport.addEventListener("pointercancel", releasePointer);

    viewport.addEventListener("wheel", event => {
      event.preventDefault();
      zoomAt(scale * Math.exp(-event.deltaY * .0015), event.clientX, event.clientY);
    }, { passive: false });

    viewport.addEventListener("dragenter", event => {
      event.preventDefault();
      viewport.classList.add("is-dropping");
    });
    viewport.addEventListener("dragover", event => event.preventDefault());
    viewport.addEventListener("dragleave", event => {
      if (!viewport.contains(event.relatedTarget)) viewport.classList.remove("is-dropping");
    });
    viewport.addEventListener("drop", event => {
      event.preventDefault();
      viewport.classList.remove("is-dropping");
      addImageFiles(event.dataTransfer.files, { x: event.clientX, y: event.clientY });
    });

    imageInput.addEventListener("change", () => addImageFiles(imageInput.files));
    penTool.addEventListener("click", () => setMode(mode === "pen" ? "move" : "pen"));
    undoButton.addEventListener("click", undo);
    deleteButton.addEventListener("click", requestDeleteSelectedImage);
    document.getElementById("zoomIn").addEventListener("click", () => zoomAt(scale * 1.2));
    document.getElementById("zoomOut").addEventListener("click", () => zoomAt(scale / 1.2));
    toolsToggle.addEventListener("click", () => setToolsOpen(!toolsPanel.classList.contains("is-open")));
    document.getElementById("closeTools").addEventListener("click", () => setToolsOpen(false));
    sheetBackdrop.addEventListener("click", () => setToolsOpen(false));

    document.getElementById("deleteImageForm").addEventListener("submit", async event => {
      event.preventDefault();
      deleteImageDialog.close();
      await deleteSelectedImage();
    });
    document.getElementById("cancelImageDelete").addEventListener("click", () => deleteImageDialog.close());
    deleteImageDialog.addEventListener("click", event => {
      if (event.target === deleteImageDialog) deleteImageDialog.close();
    });

    window.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z") {
        event.preventDefault();
        undo();
      } else if ((event.key === "Delete" || event.key === "Backspace") && selectedImageId) {
        event.preventDefault();
        requestDeleteSelectedImage();
      }
    });

    window.addEventListener("resize", () => {
      if (!images.length && !strokes.length) {
        offsetX = window.innerWidth / 2;
        offsetY = window.innerHeight / 2;
      }
      renderView();
    });

    renderView();
    loadBoard();
  </script>
</body>
</html>
